name: GameJobs hourly collection

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read official APIs without writing to Supabase
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: gamejobs-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and reconcile official postings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m collector.run --dry-run
          else
            python -m collector.run
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gamejobs-collection-report
          path: work/collector-report.json
          retention-days: 14
