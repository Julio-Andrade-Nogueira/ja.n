name: Radar integration checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collector-live-dry-run:
    name: Collector live dry-run (no Secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query the three real sources without database writes
        id: collect
        continue-on-error: true
        run: python -m collector.run --dry-run
      - name: Diagnose Lever title normalization against the same public API
        run: |
          python - <<'PY'
          import json
          from collector.http import Http
          from collector.sources import fetch_snapshot
          from collector.normalize import normalize, plain
          source = {'type': 'lever', 'board': 'xsolla', 'company': 'Xsolla'}
          rows = fetch_snapshot(Http(), source)
          repaired = []
          for row in rows:
              previous = plain(row.get('text'))
              if not previous or len(previous) > 500:
                  repaired.append({'field': 'text', 'external_id': row['id'],
                                   'raw_value': row.get('text'), 'previous_length': len(previous),
                                   'normalized_title': normalize(row, source)['title']})
          message = json.dumps({'seen': len(rows), 'repaired': repaired}, ensure_ascii=True)
          # Annotation data is escaped so source text cannot inject workflow commands.
          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=Lever title diagnosis::' + message)
          PY
      - name: Upload the real collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-live-dry-run-report
          path: work/collector-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Classify network, source contract and code failures
        if: always()
        run: python -m collector.report work/collector-report.json --expected-sources 3 --summary "$GITHUB_STEP_SUMMARY"
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
